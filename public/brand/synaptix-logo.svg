<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="100%" height="100%">
  <defs>
    <linearGradient id="animatedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF">
        <animate attributeName="stop-color" values="#00E5FF; #0066FF; #8A2BE2; #00E5FF" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#8A2BE2">
        <animate attributeName="stop-color" values="#8A2BE2; #00E5FF; #0066FF; #8A2BE2" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="50" y="140" font-size="110" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Synaptix</text>
    <text x="50" y="240" font-size="85" font-weight="700" fill="url(#animatedGrad)" filter="url(#glow)" letter-spacing="1">AI Labs</text>
    <text x="55" y="300" font-size="28" font-weight="400" fill="#A0AABF" letter-spacing="2">Programando con Sistemas Inteligentes</text>
  </g>
</svg>
